<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 58 58">
  <!-- fire, drawn as a quick ink outline: a twisting centre tongue, a lick either side, a wisp
       breaking off; the displacement gives the line a pen's unsteadiness. Black ink, white on
       dark tab bars. -->
  <style>
    .ink { stroke: #000; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #fff; } }
  </style>
  <filter id="pen" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g class="ink" fill="none" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#pen)">
    <path d="M22 57C15 53 12.5 45 14.5 38C15.5 34.5 14 31.5 11.5 29C17.5 29.5 21.5 33 22.5 38C22 30 27 25.5 27.5 18C28 13.5 26 9.5 23.5 6C31 8.5 35.5 15 36 22C36.3 26 35 29 34 31.5C38.5 30 42 25 42.5 19C47.5 25 51 32 49.5 41C48 51 41 57.5 32 58C28 58.2 24.8 57.9 22 57"/>
    <path d="M27 52C25.5 47.5 27 43.5 30 40C30.5 44 33.5 46 34 49.5"/>
    <path d="M37.5 12.5C39.5 10 39.5 7 37.5 4.5"/>
  </g>
</svg>
